# CI-2 — the free-tier verification gate (lexicamp-project/08 CI track,
# policy in 02 § CI & release/OTA policy). Linux-only on purpose: GitHub Free
# gives 2,000 Linux min/mo on private repos; macOS bills at 10×. Never run EAS
# builds here — builds happen on release tags only (15 iOS + 15 Android/mo cap).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx jest --ci

      # Token drift guard — needs the sibling design-system repo. Clones it with
      # DESIGN_SYSTEM_PAT if set (required while that repo is private); skips with
      # a warning otherwise so the pipeline stays green until the secret is added.
      - name: Token drift check
        env:
          DS_PAT: ${{ secrets.DESIGN_SYSTEM_PAT }}
        run: |
          if git clone --depth 1 "https://${DS_PAT:+x-access-token:${DS_PAT}@}github.com/grantgarland/lexicamp-design-system.git" /tmp/lexicamp-design-system 2>/dev/null; then
            TOKENS_DIR=/tmp/lexicamp-design-system/project/tokens npm run sync:tokens:check
          else
            echo "::warning::lexicamp-design-system not accessible — token drift check skipped (add a DESIGN_SYSTEM_PAT repo secret with read access)"
          fi

      # Dependency/compat guard. Non-blocking for now (some checks need network
      # or flag false positives); tighten to blocking once it's proven quiet.
      - name: expo-doctor (advisory)
        continue-on-error: true
        run: npx expo-doctor

  # CI-6 remediation loop, sensor half: a red run on main files (or updates) a
  # `ci-failure` issue so the next operator/Claude session starts from it — per
  # 07's session protocol, these issues outrank the backlog. PR failures are
  # visible on the PR itself, so only main is escalated. One rolling issue per
  # workflow (deduped by title) to avoid issue spam.
  escalate-failure:
    needs: checks
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'CI failure on main';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `**Run:** ${runUrl}`,
              `**Commit:** ${context.sha} — ${context.payload.head_commit?.message?.split('\n')[0] ?? ''}`,
              `**When:** ${new Date().toISOString()}`,
              '',
              'CI is red on main. Per `07-ai-operating-model.md`, fixing this outranks the backlog.',
              'Check the run logs, fix, and close this issue in the same session.',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'ci-failure',
            });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['ci-failure'] });
            }
