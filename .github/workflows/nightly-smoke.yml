# CI-4 — nightly E2E smoke: build the Android debug APK via EAS Build (cloud)
# and run the Maestro flows on a GitHub-hosted emulator.
#
# CHANGE-GATED: the scheduled run first checks whether HEAD has moved since the
# last successful run of this workflow; if not, the build is skipped. This keeps
# EAS free-tier usage proportional to actual commit activity (idle weeks cost 0
# builds) instead of a flat ~30/mo. `workflow_dispatch` always runs (manual
# trigger = explicit intent, e.g. re-proving a red run without a new commit).
#
# INVARIANTS (2026-07-12 hardening — see SMOKE_TEST_DIAGNOSIS.md for history):
# 1. Every code path in this file must be exercisable via workflow_dispatch.
#    The 2026-07-12 403 shipped because the gate's API call only ran on
#    `schedule` — manual verification runs never touched it. The gate now calls
#    the API on every trigger; dispatch merely forces should_run=true AFTER the
#    call succeeds, so a green manual run is a true rehearsal of the nightly.
# 2. Every job declares its token permissions explicitly (top-level default is
#    none). Behavior must not depend on the repo's default-workflow-permissions
#    setting.
# 3. No unpinned external tools. `npx eas-cli` and the Maestro installer float
#    to latest when unpinned — a breaking upstream release becomes a 3am
#    failure. Pins live in `env` below; bump them deliberately.
# 4. The gate fails OPEN: if its API call errors, we run the smoke (worst case:
#    one wasted EAS build) rather than silently losing coverage or going red on
#    infrastructure noise.
# 5. The smoke APK is built with the `smoke` EAS profile (mock DataSource,
#    EXPO_PUBLIC_USE_SUPABASE=0). The Maestro flow assumes mock mode
#    (onboardingComplete=true → boots straight to Home, no auth). A live-mode
#    (`preview`) build redirects to onboarding on first launch and the flow
#    fails at its first assertion. Keep flow and profile in lockstep.
name: Nightly smoke (Maestro + EAS)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC ≈ 3–4am ET, before the workday

concurrency:
  group: nightly-smoke
  cancel-in-progress: true

# Jobs opt in to exactly what they need (invariant 2).
permissions: {}

env:
  EXPO_NO_TELEMETRY: '1'
  # Tool pins (invariant 3). eas-cli pinned to the major (patches absorbed,
  # breaking majors excluded); eas.json enforces the >= 20.3.0 floor. Maestro's
  # installer takes an exact version only. Latest as of 2026-07-12: eas-cli
  # 20.5.1, Maestro 2.6.1.
  EAS_CLI_SPEC: 'eas-cli@20'
  MAESTRO_VERSION: '2.6.1'

jobs:
  # Change gate: skip the (expensive) EAS build when nothing has been committed
  # since the last successful run. Compares the current HEAD sha against the
  # head_sha of the newest successful run of this same workflow.
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read # listWorkflowRuns — the 2026-07-12 403 was this missing
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check for commits since last successful run
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            // Invariant 1: the API call runs on EVERY trigger so that a manual
            // dispatch rehearses the exact path the schedule uses. Do not move
            // the dispatch early-return above this call.
            let last = null;
            let gateHealthy = true;
            try {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'nightly-smoke.yml',
                status: 'success',
                per_page: 1,
              });
              last = data.workflow_runs[0] ?? null;
            } catch (e) {
              // Invariant 4: fail OPEN. A broken gate degrades to "run the
              // smoke", never to lost coverage.
              gateHealthy = false;
              core.warning(
                `Change-gate API call failed (${e.status ?? '?'}: ${e.message}). ` +
                'Failing open — running the smoke. If this is a 403, the job has ' +
                "lost its `actions: read` permission.",
              );
            }

            if (context.eventName === 'workflow_dispatch') {
              // Manual dispatch always runs — but only after the API call above,
              // so a green dispatch proves the scheduled path too.
              core.info(`Manual dispatch — running. (gate API healthy: ${gateHealthy})`);
              core.setOutput('should_run', 'true');
              return;
            }

            if (!gateHealthy) {
              core.setOutput('should_run', 'true');
              return;
            }

            const shouldRun = !last || last.head_sha !== context.sha;
            core.info(last
              ? `Last successful run: ${last.head_sha} — current HEAD: ${context.sha} — run: ${shouldRun}`
              : 'No prior successful run — running.');
            core.setOutput('should_run', String(shouldRun));

  smoke:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build Android APK via EAS
        run: |
          # --wait blocks until the cloud build finishes but does NOT download the
          # artifact (--output is local-build only). With --json the finished build
          # object — including the artifact download URL — is printed to stdout;
          # logs go to stderr, so redirecting stdout gives us clean JSON to parse.
          # Profile `smoke` = mock DataSource (invariant 5).
          npx "$EAS_CLI_SPEC" build \
            --platform android \
            --profile smoke \
            --non-interactive \
            --wait \
            --json > eas-build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK from EAS
        run: |
          mkdir -p android/app/build/outputs/apk/debug
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          URL=$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl // empty' eas-build.json)
          if [ -z "$URL" ]; then
            echo "Error: no artifact URL in EAS build output:"
            cat eas-build.json
            exit 1
          fi
          echo "Downloading APK from $URL"
          curl -fSL -o "$APK" "$URL"
          if [ ! -s "$APK" ]; then
            echo "Error: downloaded APK is missing or empty."
            exit 1
          fi
          echo "APK ready: $(du -h "$APK" | cut -f1) $APK"

      - name: Install Maestro
        run: |
          # MAESTRO_VERSION (env above) pins the installer — unpinned it pulls
          # latest and a breaking Maestro release fails the nightly (invariant 3).
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # KVM is available on GitHub-hosted Linux runners; this action manages the
      # emulator lifecycle and caches the AVD snapshot between runs.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk

            # Diagnostics (2026-07-14): a red flow tells us an assertion failed but
            # not WHY. The flows run against a RELEASE build (__DEV__=false) where a
            # JS crash or a stuck launch gate renders a blank screen and every
            # assertion fails identically. Capture logcat across the Maestro run so
            # the failure artifact carries the crash trace, not just the assertion.
            adb logcat -c
            adb logcat -v time > logcat.txt 2>&1 &
            LOGCAT_PID=$!

            # Don't let a failing flow abort the step before logcat is harvested —
            # capture the status, tear down, then re-raise it as the step's result.
            set +e
            maestro test .maestro/ --format junit --output maestro-report.xml
            MAESTRO_STATUS=$?
            set -e

            kill "$LOGCAT_PID" 2>/dev/null || true

            # Surface the app's own crashes/fatals inline so the run log alone is
            # often enough — the full logcat still ships in the artifact.
            echo "::group::logcat — lexicamp / crashes / fatals"
            grep -iE 'lexicamp|FATAL|AndroidRuntime|ReactNative|beginning of crash' logcat.txt | tail -100 || true
            echo "::endgroup::"

            exit $MAESTRO_STATUS

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results
          path: |
            maestro-report.xml
            logcat.txt
            ~/.maestro/tests/**
          if-no-files-found: ignore

  # Same sensor as ci.yml: a red nightly files/updates the rolling ci-failure
  # issue. `needs` lists BOTH jobs so a gate failure escalates explicitly, not
  # just via transitive failure() semantics.
  escalate-failure:
    needs: [changes, smoke]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = 'Nightly smoke failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `**Run:** ${runUrl}`,
              `**When:** ${new Date().toISOString()}`,
              '',
              'The nightly Maestro smoke is red. Per `07-ai-operating-model.md`, fixing this outranks the backlog.',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'ci-failure',
            });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['ci-failure'] });
            }
