# CI-4 — nightly E2E smoke: build the Android debug APK via EAS Build (cloud)
# and run the Maestro flows on a GitHub-hosted emulator.
#
# CHANGE-GATED: the scheduled run first checks whether HEAD has moved since the
# last successful run of this workflow; if not, the build is skipped. This keeps
# EAS free-tier usage proportional to actual commit activity (idle weeks cost 0
# builds) instead of a flat ~30/mo. `workflow_dispatch` always runs (manual
# trigger = explicit intent, e.g. re-proving a red run without a new commit).
#
# See SMOKE_TEST_DIAGNOSIS.md for rationale.
name: Nightly smoke (Maestro + EAS)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC ≈ 3–4am ET, before the workday

concurrency:
  group: nightly-smoke
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  # Change gate: skip the (expensive) EAS build when nothing has been committed
  # since the last successful run. Compares the current HEAD sha against the
  # head_sha of the newest successful run of this same workflow.
  changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check for commits since last successful run
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            // Manual dispatch always runs — it's an explicit request.
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('should_run', 'true');
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'nightly-smoke.yml',
              status: 'success',
              per_page: 1,
            });
            const last = data.workflow_runs[0];
            const shouldRun = !last || last.head_sha !== context.sha;
            core.info(last
              ? `Last successful run: ${last.head_sha} — current HEAD: ${context.sha} — run: ${shouldRun}`
              : 'No prior successful run — running.');
            core.setOutput('should_run', String(shouldRun));

  smoke:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build Android APK via EAS
        run: |
          # --wait blocks until the cloud build finishes but does NOT download the
          # artifact (--output is local-build only). With --json the finished build
          # object — including the artifact download URL — is printed to stdout;
          # logs go to stderr, so redirecting stdout gives us clean JSON to parse.
          npx eas-cli build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > eas-build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK from EAS
        run: |
          mkdir -p android/app/build/outputs/apk/debug
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          URL=$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl // empty' eas-build.json)
          if [ -z "$URL" ]; then
            echo "Error: no artifact URL in EAS build output:"
            cat eas-build.json
            exit 1
          fi
          echo "Downloading APK from $URL"
          curl -fSL -o "$APK" "$URL"
          if [ ! -s "$APK" ]; then
            echo "Error: downloaded APK is missing or empty."
            exit 1
          fi
          echo "APK ready: $(du -h "$APK" | cut -f1) $APK"

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # KVM is available on GitHub-hosted Linux runners; this action manages the
      # emulator lifecycle and caches the AVD snapshot between runs.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            maestro test .maestro/ --format junit --output maestro-report.xml

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results
          path: |
            maestro-report.xml
            ~/.maestro/tests/**
          if-no-files-found: ignore

  # Same sensor as ci.yml: a red nightly files/updates the rolling ci-failure
  # issue (only meaningful once the schedule is enabled and flows are proven).
  escalate-failure:
    needs: smoke
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = 'Nightly smoke failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `**Run:** ${runUrl}`,
              `**When:** ${new Date().toISOString()}`,
              '',
              'The nightly Maestro smoke is red. Per `07-ai-operating-model.md`, fixing this outranks the backlog.',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'ci-failure',
            });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['ci-failure'] });
            }
