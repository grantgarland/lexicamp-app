# Release (iOS) — production EAS build + App Store Connect delivery, so the
# artifact lands in TestFlight. iOS only, per the 2026-07-27 iOS-only launch
# decision recorded in 02 (the Android path stays alive only as the emulator
# smoke in nightly-smoke.yml — a CI artifact, never distributed).
#
# ─────────────────────────────────────────────────────────────────────────────
# MANUAL TRIGGER ONLY — and that IS the quota control.
#
# 02 § "CI & release/OTA policy" caps native builds because EAS free tier is
# **15 iOS + 15 Android builds/mo**, and the nightly Android smoke already
# spends ~13 of its own 15. 15 iOS builds is ~3.4/week: a single busy week of
# automatic builds would eat half the month, and once the cap is hit there is
# no release path until the 1st (or until someone buys Expo Starter — $19/mo,
# inside the ≤$100/mo budget of 00, but a decision to make deliberately rather
# than stumble into).
#
# So there is no `push:` trigger here. Every build is a human opening the
# Actions tab and pressing "Run workflow", which means the operator spends a
# build slot only when they mean to. This is stricter than 02's documented
# tag-triggered policy and satisfies it: a tag cut can still be paired with a
# dispatch, but a stray tag push cannot burn a slot on its own.
#
# The corollary — do not add a `push:` trigger back without re-reading the
# quota math above. If release cadence ever justifies automation, the honest
# version is `push: tags: ['v*']` (a tag cut is always intentional), not
# push-to-main.
# ─────────────────────────────────────────────────────────────────────────────
#
# Runs on ubuntu-latest, NOT macOS. The build itself happens on Expo's servers;
# this runner only drives the CLI and waits. GitHub Free gives 2,000 Linux
# min/mo on private repos and bills macOS at 10× — the same rule that shapes
# ci.yml and nightly-smoke.yml. There is no reason to pay 10× to sit in a wait
# loop, and no prebuild step is needed here: `ios/` and `android/` are
# gitignored, so EAS does a managed prebuild in the cloud.
name: Release iOS (TestFlight)

on:
  workflow_dispatch:
    inputs:
      # Every store build after an approval needs a HIGHER marketing version.
      # App Store Connect closes a version's train once it is approved, and
      # EAS only auto-increments the build number. Build 17 (2026-10-14) was
      # rejected for exactly this: still 1.0.0 after 1.0.0 was approved
      # (ITMS-90186 / ITMS-90062). The `version` job applies this bump to
      # expo.version in app.json and commits it to main BEFORE building.
      bump:
        description: >-
          Version bump. patch = fixes, minor = new features, major = big change.
          none = rebuild the CURRENT version, only valid while Apple has NOT
          approved it yet (e.g. retrying a failed build).
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
          - none

# Not a skip-gate — a serializer. Two dispatches in quick succession would
# otherwise race on the remote build-number counter (`autoIncrement`) and spend
# two slots for one release. `cancel-in-progress` is deliberately FALSE:
# cancelling this runner does not refund a build already handed to Expo, so
# queueing is strictly better than cancelling here.
concurrency:
  group: release-ios
  cancel-in-progress: false

# Jobs opt in to exactly what they need (nightly-smoke.yml invariant 2:
# behavior must not depend on the repo's default-workflow-permissions setting).
permissions: {}

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  # Cheap Linux gate in front of a scarce resource. The reasoning is purely
  # economic: an EAS build slot is 1/15th of the month and takes ~20-40 min of
  # wall clock; a typecheck + jest + bundle-verify pass is ~4 min of free Linux
  # minutes. Spending a build slot on code that a two-minute check would have
  # rejected is the expensive mistake this job exists to prevent — which is
  # more true under a manual trigger, not less, since a dispatch is usually the
  # first build that commit has ever seen.
  #
  # Deliberately NOT the full ci.yml suite. ci.yml already ran on this commit
  # when it landed on main — re-running lint, token drift and expo-doctor here
  # would double the cost to catch nothing new. What is kept is the subset
  # whose failure would produce a *broken or unshippable binary*:
  #   - typecheck  — a type error is a build failure on EAS, 30 min later.
  #   - jest --ci  — the domain invariants (FSRS, capture gate, i18n parity)
  #                  are unit-enforced; a red suite means shipping wrong math.
  #   - verify:bundle — the App Store gate from 02/CLAUDE.md: proves the DEV
  #                  scenario switcher is absent from a real production export.
  #                  This is the one check whose failure mode is literally "we
  #                  submitted dev tooling to Apple", so it gates the store
  #                  path as well as the PR path.
  #   - verify:eas-env — proves the `production` EAS environment holds the
  #                  variables the binary needs (and not the dev password).
  #                  Its failure mode is a build that looks perfect and cannot
  #                  transact; see the step's own comment.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    steps:
      # Releases come from main only. The version job pushes a bump commit to
      # main, and README › Release § 1 already requires the work to land there
      # first. Checked here so a wrong-branch dispatch costs nothing.
      - name: Dispatched from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release iOS must be dispatched from main (got ${GITHUB_REF})."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx jest --ci

      - name: No dev-only code in the production bundle
        run: npm run verify:bundle

      # Added 2026-08-31, after EXPO_PUBLIC_REVENUECAT_IOS_API_KEY was found to
      # have NEVER been in any EAS environment: it lived only in one machine's
      # .env.local, so every EAS build shipped with the paywall dead
      # (purchasesStatus=disabled-no-key) while every manual purchase test
      # passed -- because a DEVELOPMENT build reads EXPO_PUBLIC_* from local
      # .env.local through Metro, not from the build environment.
      #
      # Nothing else here can catch that: typecheck, jest and verify:bundle all
      # inspect the source or the artifact, and the artifact looks fine -- the
      # value is simply inlined as undefined. This asks the one question they
      # cannot: does the environment this build will actually read contain what
      # the app needs?
      - name: Production EAS environment has the variables the build needs
        run: npm run verify:eas-env
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # Applies the dispatch's `bump` to expo.version, commits it to main and tags
  # it, so the repo always says what the store has. That matters twice:
  #   - the NEXT bump starts from the version actually shipped, and
  #   - OTA updates (npm run update:ota) are built from main, so main has to
  #     describe the binary they target.
  # The version is deliberately excluded from the expo-updates fingerprint
  # (fingerprint.config.js), so a bump alone never strands users on an older
  # version from OTA fixes.
  #
  # Runs AFTER preflight, so a red gate never leaves a bump on main, and BEFORE
  # build-ios, which builds the exact commit this job pushes.
  #
  # Race safety: it bumps the dispatched commit (github.sha), not whatever main
  # is by now. If main moved after the dispatch, the push is non-fast-forward
  # and fails here, before a build slot is spent, instead of shipping commits
  # that preflight never checked. Re-dispatch to pick them up.
  #
  # The push uses GITHUB_TOKEN, and pushes made with GITHUB_TOKEN do not
  # trigger other workflows, so the bump commit does not set off ci.yml.
  version:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the bump commit + tag to main
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1

      # Pure Node, no npm ci: the script only reads and writes app.json.
      - name: Bump expo.version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: node scripts/bump-version.js "$BUMP"

      - name: Commit, tag and push to main
        id: commit
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          CHANGED: ${{ steps.bump.outputs.changed }}
        run: |
          if [ "$CHANGED" != "true" ]; then
            echo "bump=none: rebuilding ${VERSION} from ${GITHUB_SHA} with no version commit."
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A tag that already exists means this version was already built,
          # and possibly approved. Shipping it again is the ITMS-90062 rejection
          # this job exists to prevent.
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Tag v${VERSION} already exists. Choose a larger bump."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          if ! git push --atomic origin "HEAD:refs/heads/main" "refs/tags/v${VERSION}"; then
            echo "::error::main moved after this run was dispatched. Nothing was pushed and no build slot was spent; re-dispatch."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "### Releasing v${VERSION}" >> "$GITHUB_STEP_SUMMARY"

  build-ios:
    needs: version
    runs-on: ubuntu-latest
    # Generous on purpose: `--wait` blocks for the whole cloud build, and free
    # tier has no priority queue — a busy period can leave the job queued well
    # before it starts compiling. This is wall-clock on a runner that is idle
    # 95% of the time, not compute.
    timeout-minutes: 90
    permissions:
      contents: read # checkout
    steps:
      # The commit the version job pushed (or the dispatched one, for
      # bump=none). Pinned by sha, not `main`, so a later push cannot change
      # what this slot builds.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      # node_modules IS required locally even though the build runs remotely:
      # eas-cli evaluates the app config before uploading, which resolves the
      # config plugins in app.json (`@sentry/react-native/expo`,
      # `./plugins/withAndroidLocaleConfig`, `./plugins/withAsyncStorageDbSize`).
      # Without an install, plugin resolution fails before EAS is ever reached.
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install
        run: npm ci

      # Pinned to the major (v9), matching how nightly-smoke.yml pins
      # `eas-cli@20`: patches absorbed, breaking majors excluded.
      #
      # `eas-version: latest` is a deliberate exception to nightly-smoke.yml's
      # invariant 3 ("no unpinned external tools"), and the tradeoff is worth
      # naming: a release path is the one place where an eas-cli lagging behind
      # Expo's server-side API is its own failure mode, and eas.json's
      # `cli.version: ">= 20.3.0"` floor already rejects anything too old. If a
      # breaking eas-cli release ever red-lines this workflow, pin it here to
      # the major (e.g. `eas-version: 20.x`) and note it in 02.
      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # ───────────────────────────────────────────────────────────────────────
      # WHAT THIS STEP DEPENDS ON, none of which lives in this repo.
      #
      # GitHub secret (Settings → Secrets and variables → Actions):
      #   - EXPO_TOKEN — Expo personal access token. The ONLY GitHub secret
      #     this workflow needs; nightly-smoke.yml already uses it.
      #
      # EAS-side, stored on Expo's servers and injected into the build
      # container (GitHub secrets do NOT exist in there). eas.json's production
      # profile sets `"environment": "production"`, which is what makes the
      # `production` environment's variables visible to this build:
      #   - SENTRY_AUTH_TOKEN (visibility: secret) — the production profile is
      #     the only one that does not set SENTRY_DISABLE_AUTO_UPLOAD, so the
      #     Sentry build phase uploads source maps during the build. Without
      #     this the upload fails or silently ships an unsymbolicated release,
      #     defeating CI-3.
      #   - EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY,
      #     EXPO_PUBLIC_SENTRY_DSN (visibility: plaintext) — read via
      #     process.env in src/. EXPO_PUBLIC_* is INLINED into the JS bundle
      #     and is therefore public by construction; that is fine for these
      #     three (the anon key is RLS-guarded, the DSN is a write-only
      #     ingest endpoint) and must never be true of a service-role key.
      #   Set with `eas env:set --environment production --visibility <level>`.
      #   NOTE: `eas secret:*` was replaced by `eas env:*` — do not use the old
      #   commands, and do NOT bulk-push .env.local, which also holds
      #   server-only keys (service role, MS translator, Resend, RevenueCat
      #   secret) that belong in Supabase Edge Function secrets, not in a
      #   client build.
      #
      # EAS credentials (`eas credentials`, iOS), stored on Expo's servers:
      #   - Distribution certificate + provisioning profile. `--non-interactive`
      #     fails rather than prompting to create them.
      #   - App Store Connect API key (.p8) so the submit can authenticate
      #     without an interactive Apple login. Never commit the .p8 — it is
      #     covered by the `*.p8` line in .gitignore.
      #
      # TWO NUMBERS, TWO OWNERS. The BUILD number (CFBundleVersion) belongs to
      # EAS: eas.json sets `cli.appVersionSource: "remote"` with
      # `build.production.autoIncrement: true`, so it increments server-side
      # and must never be bumped here or added to app.json. The MARKETING
      # version (CFBundleShortVersionString) is expo.version, set by the
      # `version` job above from the dispatch's `bump` input.
      # ───────────────────────────────────────────────────────────────────────
      - name: Build production iOS app and submit to App Store Connect
        # --wait blocks until the cloud build finishes (and surfaces its exit
        # status here, so a failed build fails this job). --auto-submit chains
        # the submission using eas.json's `submit.production` profile
        # (ascAppId 6792857650), which keeps this a single command and avoids
        # re-resolving the artifact URL the way nightly-smoke.yml has to for
        # its APK download.
        run: |
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --auto-submit \
            --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # Same sensor as ci.yml and nightly-smoke.yml, on its own label so a broken
  # release path is distinguishable at a glance from a broken PR gate. One
  # rolling issue per workflow (deduped by title) to avoid issue spam. Per 07's
  # session protocol these issues outrank the backlog — and a red release means
  # either a burned build slot or an artifact stuck short of TestFlight, so
  # this one outranks a red ci.yml in practice.
  escalate-failure:
    needs: [preflight, version, build-ios]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = 'iOS release failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `**Run:** ${runUrl}`,
              `**Ref:** ${context.ref} @ ${context.sha}`,
              `**Dispatched by:** @${context.actor}`,
              `**When:** ${new Date().toISOString()}`,
              '',
              'The production iOS build/submit path is red.',
              '',
              'Triage order:',
              '1. Did `preflight` or `version` fail? Then no EAS build slot was spent — fix and re-dispatch.',
              '   If `version` says main moved, just re-dispatch.',
              '2. Did `build-ios` fail *during the build*? A slot is gone (EAS free tier: 15 iOS/mo).',
              '   Check remaining quota before re-dispatching. The version bump is already on main',
              '   and tagged, so re-dispatch with bump=none; that version was never approved.',
              '3. Did it fail at *submit*? The .ipa exists on EAS — recover with',
              '   `eas submit --platform ios --latest` rather than rebuilding.',
              '',
              'Per `07-ai-operating-model.md`, fixing this outranks the backlog.',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'release-failure',
            });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['release-failure'] });
            }
