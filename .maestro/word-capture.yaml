# CI-4b — search/capture flow smoke: the CRUD surfaces that exist today,
# against the mock DataSource (`smoke` EAS profile / dev builds).
#
# EXECUTION STATUS (2026-08-06). The flow now runs GREEN end to end — every
# command, including the previously-never-executed tail (Save, the phrase card,
# the three gates, the Word List swipe→confirm→toast delete), has passed on a
# device: local iOS simulator (iPhone 16 Pro Max, iOS 18.6), Release dev build,
# mock DataSource. The long red streak was never the app; it was two selector
# bugs in this file (whole-text matching, then iOS a11y row merging — see the
# `.*` notes at 'la mosca.*' and '.*melancólico.*') plus `hideKeyboard` throwing
# on iOS. The Android leg is still only exercised by the nightly cron: the three
# fixes are all selector-loosening or platform-neutral, but a first Android
# failure after 08-06 should be read against these notes before the app.
#
# ANDROID LEG, first run (2026-08-11, run 31373413201). It got 1m58s deep —
# lookup, 'la mosca', the lazy example fetch, the scroll and the tap on
# result-save all passed — and died on the very next line, `assertVisible:
# 'Saved!'`. That was a RACE, not a selector bug and not the app: see the ⚠️ at
# the CREATE step. The assertion is now on the durable end state. Everything
# after that step is STILL unexecuted on Android; a failure below the CREATE
# block is a genuine first run, not a regression.
#
# SELECTOR POLICY (2026-07-17): tap by testID, assert by TEXT.
#   - Taps/gestures only need to FIND an element → ids are locale-proof, immune
#     to copy changes, and collision-free (the 2026-07-16 system-Home-button bug;
#     the old tray-vs-confirm 'Delete' ambiguity that needed a `below:` anchor).
#     Ids: fab-search / search-input / search-clear / search-close (SearchScreen,
#     TabBar) · word-row-delete (WordRow tray) · confirm-accept (ConfirmDialog).
#   - Assertions VERIFY rendered content → they stay text on purpose. An id-only
#     assert passes on an empty or wrong render. Text drift is guarded at commit
#     time by src/test/maestroStrings.test.ts.
#   - Exception: the swipe anchors on text 'melancólico' — it doubles as a
#     content check (fixture word rendered), and row testIDs would need unicode/
#     index-based ids for no gain.
#   - WHOLE-TEXT MATCH (2026-07-27, the hard one): a text selector must match the
#     element's ENTIRE text. Maestro compiles it to a regex and calls
#     Regex.matches() (maestro.Filters.textMatches), not find(); the docs' own
#     "partial match" example is `.*Continue.*` for exactly this reason. So a
#     selector must be the string the widget PRINTS — determiners, punctuation
#     and all — or carry explicit `.*`. Assert what the screen says, not what
#     the fixture field holds.
#
# What this verifies vs. what it CAN'T (mock-mode reality, 2026-07-13):
#   CREATE — lookup renders + Save flips the card into its saved state (asserted
#            as "Delete word", the DURABLE end state — see the ⚠️ at that step
#            for why the "Saved!" confirmation itself is unassertable). Mock
#            saveCard() is a no-op and getWords() serves fixtures, so the saved
#            word does NOT appear in Word List. True create→read persistence
#            needs the live (Supabase) path + a seeded account — CI-7, deferred.
#   READ   — deterministic mock fixtures: 'fly' → volar + "la mosca" (Azure docs
#            example; the noun sense carries prefixWord 'la' and RENDERS with
#            it), phrase path fabricates '<phrase>·es'.
#   UPDATE — no update operation exists in DataSource; nothing to test yet.
#   DELETE — swipe tray → confirm dialog → toast + count decrement. Client-
#            optimistic only ("until the real delete mutation (03 write) lands").
# Gate paths (doc 16 §2): not_found (reserved miss token), identity-echo →
# unsaveable card, Tier-0 not_a_word (digits). wrong_script needs non-Latin
# input; Maestro inputText is ASCII-only on Android, so that case lives in the
# jest capture tests, not here.
#
# Fixture couplings (update together): mock.ts SMOKE_FIXTURES (WORD_BANK/
# DISTRIBUTION — summit = 60 words, melancólico present; MOCK_MISS='fly123456';
# MOCK_ECHO='echoword'; FLY_SENSES), en.json strings asserted below. All of
# these are enforced by src/test/maestroStrings.test.ts.
#
# Run locally: maestro test .maestro/word-capture.yaml
appId: com.lexicamp.app
tags:
  - candidate
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '(?i)Word Mastery'
    timeout: 20000

# ── Open search (FAB) ────────────────────────────────────────────────────────
- tapOn:
    id: 'fab-search'
- assertVisible: 'Type a word in .*' # placeholder = search sheet actually open

# ── READ: happy path — mock fixture 'fly' → volar (verb) + "la mosca" (noun) ──
- tapOn:
    id: 'search-input'
- inputText: 'fly'
- extendedWaitUntil:
    visible: 'volar'
    timeout: 10000
# Dismiss the autofocus keyboard before touching the lower card. MEASURED, not
# inferred (run 30261088531 artifact): with the IME up the app window is clipped
# somewhere in y 1435–1517 of 2400, and Maestro's driver logs `result-save`
# (y 1517–1660) and the second-sense row (y 1704–1844) as invisible children;
# after this command both are present in the dumped hierarchy.
#
# ⚠️ NOT `hideKeyboard` (changed 2026-08-06). It is platform-divergent in two
# incompatible ways and both are hazards:
#   • Android: literally `input keyevent 4` — an UNCONDITIONAL BACK press
#     (AndroidDriver.hideKeyboard). It never checks whether an IME is showing, so
#     anywhere the keyboard happens to be down it silently back-navigates and
#     pops this overlay — the 2026-07-16 system-Home-button collision again.
#   • iOS: it THROWS. `CommandFailed: Couldn't hide the keyboard. This can happen
#     if the app uses a custom input or doesn't expose a standard dismiss action.`
#     — which is what red-lit this flow on the 2026-08-06 local run.
#
# `pressKey: Enter` blurs and does nothing else, identically on both platforms:
# the search field is single-line with returnKeyType="search" and NO
# onSubmitEditing wired (SearchScreen), so RN's default blurOnSubmit drops the
# IME without re-running the search and without navigating.
- pressKey: Enter
# The second sense RENDERS its determiner: mock FLY_SENSES gives mosca
# prefixWord 'la', and toCardResult composes "la mosca" via
# domain/translation.senseDisplayWord. Maestro matches the WHOLE element text,
# so the old `'mosca'` selector could never match this row — three red nightlies
# (07-22/07-24/07-27), twice misdiagnosed as keyboard occlusion. The 07-27
# artifact settles it: the failure hierarchy contains a visible TextView reading
# exactly "la mosca" at [92,1741][264,1810], and no node whose text is "mosca".
# scrollUntilVisible (no centerElement) stays as cheap insurance against future
# card growth — it returns immediately when the element is already visible.
#
# ⚠️ TRAILING `.*` IS LOAD-BEARING, and it is the cross-platform half of the
# whole-text rule above (2026-08-06). The sense row renders the word and its POS
# as two sibling <Text>s. Android's accessibility tree keeps them as two nodes,
# so a TextView reads exactly "la mosca" (the 07-27 artifact). iOS MERGES the row
# into ONE element whose accessibilityText is "la mosca, noun" — verified in the
# local `maestro hierarchy` dump: there is no node reading just "la mosca". A
# bare 'la mosca' selector therefore passes on Android and can never match on
# iOS. `la mosca.*` matches both (`.*` also matches empty).
- scrollUntilVisible:
    element:
      text: 'la mosca.*'
    direction: DOWN
    timeout: 15000
- assertVisible: 'la mosca.*'

# ── READ: the LAZY example fetch (added 2026-08-06) ─────────────────────────
# Examples are deliberately not part of the lookup — they cost money, so they
# fetch once, on demand, per translation (invariant 4 in CLAUDE.md: "Examples
# fetch lazily, once per translation"). That makes "tap the button, a sentence
# appears" a real read path with its own loading and error states, and nothing
# else in the suite exercised it.
#
# Asserting the TARGET side, composed prefix+term+suffix exactly as
# TranslationCard renders it — the mock serves one canned example for
# 'mock-t:fly' (mock.FLY_EXAMPLE, exported through SMOKE_FIXTURES so the guard
# builds this same string).
- tapOn:
    id: 'result-example'
#
# ⚠️ `.*`-wrapped: the card renders the sentence inside TYPOGRAPHIC QUOTES
# (“…”), so the element's whole text is not the bare sentence the fixture holds.
# Maestro matches whole text; the guard composes the bare form. The wrapper
# satisfies both.
- extendedWaitUntil:
    visible: '.*Quiero decir, para un tipo que podía volar\..*'
    timeout: 10000

# ── CREATE: save flips to optimistic saved state ─────────────────────────────
- scrollUntilVisible:
    element:
      id: 'result-save'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'result-save'
# ⚠️ DO NOT assert 'Saved!' HERE — it is a 1.5-SECOND TRANSIENT and no timeout
# can make it reliable (2026-08-11, run 31373413201). SearchScreen does
# `setJustSaved(id); setTimeout(() => setJustSaved(null), 1500)`, and
# TranslationCard's buttonState is save → saved (while justSavedId matches) →
# delete. So "Saved!" EXPIRES; a polling assert that arrives late finds "Delete
# word" and fails, and extending the timeout makes it strictly worse.
#
# The local iOS simulator wins that race and the CI Android emulator loses it,
# which is the whole local-green / nightly-red asymmetry for this flow: the
# emulator is software-rendered (`Failed to find ColorBuffer` in that run), every
# hierarchy dump walks hundreds of nodes, and Maestro's post-tap settle wait runs
# BEFORE the assert — with the saved chip entering under a Reanimated
# FadeIn.duration(200) to keep that wait alive.
#
# Asserting the DURABLE end state instead is also a strictly stronger check:
# "Saved!" only proves the transient fired, whereas "Delete word" proves the sense
# is in `savedIds` — i.e. the save actually stuck. extendedWaitUntil because the
# 1.5s transient has to expire first on a device fast enough to have shown it.
- extendedWaitUntil:
    visible: 'Delete word'
    timeout: 10000

# ── READ: phrase path (unknown Latin phrase → fabricated '<phrase>·es') ──────
- tapOn:
    id: 'search-clear'
- tapOn:
    id: 'search-input'
- inputText: 'buenos dias'
- extendedWaitUntil:
    visible: 'buenos dias·es'
    timeout: 10000
# The re-tap above raises the IME again, and this (shorter) card puts Save near
# the clip line. Blur it the same way — with hideKeyboard gone, a second dismiss
# here is safe rather than a latent back-navigation. scrollUntilVisible stays as
# insurance and returns immediately when the element is already visible.
- pressKey: Enter
- scrollUntilVisible:
    element:
      text: 'Save word'
    direction: DOWN
    timeout: 15000
- assertVisible: 'Save word'

# ── Gate: not_found (MOCK_MISS reserved token) ───────────────────────────────
- tapOn:
    id: 'search-clear'
- tapOn:
    id: 'search-input'
- inputText: 'fly123456'
- extendedWaitUntil:
    visible: "We couldn't find that one."
    timeout: 10000

# ── Gate: identity-echo → unsaveable card (Save replaced, notice shown) ──────
- tapOn:
    id: 'search-clear'
- tapOn:
    id: 'search-input'
- inputText: 'echoword'
# Same reasoning as the phrase card: the unsaveable notice + locked action sit at
# the bottom of the card with the IME up. scrollUntilVisible both WAITS (it polls
# the hierarchy) and scrolls, so it replaces the extendedWaitUntil here.
- scrollUntilVisible:
    element:
      text: "Can't save this"
    direction: DOWN
    timeout: 15000
- assertVisible: "Can't save this"

# ── Gate: Tier-0 not_a_word (digits only; instant, no debounce/API) ──────────
- tapOn:
    id: 'search-clear'
- tapOn:
    id: 'search-input'
- inputText: '12345'
- assertVisible: "Hmm, that's not quite a card"

# ── DELETE UX: Word List swipe tray → confirm → toast + count drops ─────────
- tapOn:
    id: 'search-close'
- tapOn:
    id: 'tab-words'
- assertVisible: 'My Words'
- assertVisible: '60 words' # SMOKE_FIXTURES.DISTRIBUTION.summit total
# Wrapped in `.*` for the same cross-platform reason as 'la mosca.*' above, one
# step further: iOS merges the ENTIRE row into a single element reading
# "Base Camp tier, BC, melancholic, melancólico, Due now, 2 reviews" (verified in
# a local `maestro hierarchy` dump), so the fixture word is in the MIDDLE of the
# text, not at the start. Android keeps the word as its own TextView, which
# `.*melancólico.*` still matches.
- swipe:
    from:
      text: '.*melancólico.*' # text on purpose — content anchor (see policy above)
    direction: LEFT
- tapOn:
    id: 'word-row-delete' # tray action (tray mounts only while swiped open)
# The TARGET word. Delete/remove copy names the target everywhere as of
# 2026-08-06 — it used to interpolate `native` here while the archive toast used
# `target`, so the same row was called two different things depending on which
# action you took.
- assertVisible: 'Delete “melancholic”\?'
- tapOn:
    id: 'confirm-accept' # ConfirmDialog confirm — no `below:` anchor needed
- assertVisible: 'Deleted “melancholic”'
- assertVisible: '59 words'

# ── Round trip home (same dead-screen guard as smoke.yaml) ───────────────────
- tapOn:
    id: 'tab-home'
- extendedWaitUntil:
    visible: '(?i)Word Mastery'
    timeout: 20000
