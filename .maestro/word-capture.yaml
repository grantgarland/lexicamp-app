# CI-4b — search/capture flow smoke: the CRUD surfaces that exist today,
# against the mock DataSource (`smoke` EAS profile / dev builds).
#
# EXECUTION STATUS (2026-07-28). Every CI run so far died at the second-sense
# assert, so only the steps up to and including `- assertVisible: 'la mosca'`
# have ever executed on a device. Everything below it — Save, the phrase card,
# the three gates, the whole Word List delete section — is still first-run: it
# type-checks against en.json + fixtures (src/test/maestroStrings.test.ts) but
# has never been exercised. Treat a failure below that line as a NEW finding,
# not a regression, and prefer the flow's gesture/visibility assumptions as the
# first suspect over the app (the row `swipe` most of all).
#
# SELECTOR POLICY (2026-07-17): tap by testID, assert by TEXT.
#   - Taps/gestures only need to FIND an element → ids are locale-proof, immune
#     to copy changes, and collision-free (the 2026-07-16 system-Home-button bug;
#     the old tray-vs-confirm 'Delete' ambiguity that needed a `below:` anchor).
#     Ids: fab-search / search-input / search-clear / search-close (SearchScreen,
#     TabBar) · word-row-delete (WordRow tray) · confirm-accept (ConfirmDialog).
#   - Assertions VERIFY rendered content → they stay text on purpose. An id-only
#     assert passes on an empty or wrong render. Text drift is guarded at commit
#     time by src/test/maestroStrings.test.ts.
#   - Exception: the swipe anchors on text 'melancólico' — it doubles as a
#     content check (fixture word rendered), and row testIDs would need unicode/
#     index-based ids for no gain.
#   - WHOLE-TEXT MATCH (2026-07-27, the hard one): a text selector must match the
#     element's ENTIRE text. Maestro compiles it to a regex and calls
#     Regex.matches() (maestro.Filters.textMatches), not find(); the docs' own
#     "partial match" example is `.*Continue.*` for exactly this reason. So a
#     selector must be the string the widget PRINTS — determiners, punctuation
#     and all — or carry explicit `.*`. Assert what the screen says, not what
#     the fixture field holds.
#
# What this verifies vs. what it CAN'T (mock-mode reality, 2026-07-13):
#   CREATE — lookup renders + Save flips to "Saved!". Mock saveCard() is a
#            no-op and getWords() serves fixtures, so the saved word does NOT
#            appear in Word List. True create→read persistence needs the live
#            (Supabase) path + a seeded account — CI-7, deferred.
#   READ   — deterministic mock fixtures: 'fly' → volar + "la mosca" (Azure docs
#            example; the noun sense carries prefixWord 'la' and RENDERS with
#            it), phrase path fabricates '<phrase>·es'.
#   UPDATE — no update operation exists in DataSource; nothing to test yet.
#   DELETE — swipe tray → confirm dialog → toast + count decrement. Client-
#            optimistic only ("until the real delete mutation (03 write) lands").
# Gate paths (doc 16 §2): not_found (reserved miss token), identity-echo →
# unsaveable card, Tier-0 not_a_word (digits). wrong_script needs non-Latin
# input; Maestro inputText is ASCII-only on Android, so that case lives in the
# jest capture tests, not here.
#
# Fixture couplings (update together): mock.ts SMOKE_FIXTURES (WORD_BANK/
# DISTRIBUTION — summit = 60 words, melancólico present; MOCK_MISS='fly123456';
# MOCK_ECHO='echoword'; FLY_SENSES), en.json strings asserted below. All of
# these are enforced by src/test/maestroStrings.test.ts.
#
# Run locally: maestro test .maestro/word-capture.yaml
appId: com.lexicamp.app
tags:
  - candidate
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '(?i)Word Mastery'
    timeout: 20000

# ── Open search (FAB) ────────────────────────────────────────────────────────
- tapOn:
    id: 'fab-search'
- assertVisible: 'Type a word in .*' # placeholder = search sheet actually open

# ── READ: happy path — mock fixture 'fly' → volar (verb) + "la mosca" (noun) ──
- tapOn:
    id: 'search-input'
- inputText: 'fly'
- extendedWaitUntil:
    visible: 'volar'
    timeout: 10000
# Dismiss the autofocus keyboard before touching the lower card. MEASURED, not
# inferred (run 30261088531 artifact): with the IME up the app window is clipped
# somewhere in y 1435–1517 of 2400, and Maestro's driver logs `result-save`
# (y 1517–1660) and the second-sense row (y 1704–1844) as invisible children;
# after this command both are present in the dumped hierarchy.
#
# ⚠️ hideKeyboard on Android is literally `input keyevent 4` — an UNCONDITIONAL
# BACK press (AndroidDriver.hideKeyboard: shell "input keyevent 4"; sleep 300;
# settle). It does not check whether an IME is showing. Only ever place it where
# the keyboard is provably up — i.e. immediately after typing into the
# autofocused search input. Anywhere else it is a back-navigation that would pop
# this overlay, exactly like the 2026-07-16 system-Home-button collision.
- hideKeyboard
# The second sense RENDERS its determiner: mock FLY_SENSES gives mosca
# prefixWord 'la', and toCardResult composes "la mosca" via
# domain/translation.senseDisplayWord. Maestro matches the WHOLE element text,
# so the old `'mosca'` selector could never match this row — three red nightlies
# (07-22/07-24/07-27), twice misdiagnosed as keyboard occlusion. The 07-27
# artifact settles it: the failure hierarchy contains a visible TextView reading
# exactly "la mosca" at [92,1741][264,1810], and no node whose text is "mosca".
# scrollUntilVisible (no centerElement) stays as cheap insurance against future
# card growth — it returns immediately when the element is already visible.
- scrollUntilVisible:
    element:
      text: 'la mosca'
    direction: DOWN
    timeout: 15000
- assertVisible: 'la mosca'

# ── CREATE: save flips to optimistic saved state ─────────────────────────────
- scrollUntilVisible:
    element:
      id: 'result-save'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'result-save'
- assertVisible: 'Saved!'

# ── READ: phrase path (unknown Latin phrase → fabricated '<phrase>·es') ──────
- tapOn:
    id: 'search-clear'
- tapOn:
    id: 'search-input'
- inputText: 'buenos dias'
- extendedWaitUntil:
    visible: 'buenos dias·es'
    timeout: 10000
# The re-tap above raises the IME again, and this (shorter) card puts Save near
# the clip line. A second `hideKeyboard` is NOT the fix — see the BACK-press
# warning above; if the tap had not re-raised the IME it would pop the overlay.
# scrollUntilVisible has no side effect either way.
- scrollUntilVisible:
    element:
      text: 'Save word'
    direction: DOWN
    timeout: 15000
- assertVisible: 'Save word'

# ── Gate: not_found (MOCK_MISS reserved token) ───────────────────────────────
- tapOn:
    id: 'search-clear'
- tapOn:
    id: 'search-input'
- inputText: 'fly123456'
- extendedWaitUntil:
    visible: "We couldn't find that one."
    timeout: 10000

# ── Gate: identity-echo → unsaveable card (Save replaced, notice shown) ──────
- tapOn:
    id: 'search-clear'
- tapOn:
    id: 'search-input'
- inputText: 'echoword'
# Same reasoning as the phrase card: the unsaveable notice + locked action sit at
# the bottom of the card with the IME up. scrollUntilVisible both WAITS (it polls
# the hierarchy) and scrolls, so it replaces the extendedWaitUntil here.
- scrollUntilVisible:
    element:
      text: "Can't save this"
    direction: DOWN
    timeout: 15000
- assertVisible: "Can't save this"

# ── Gate: Tier-0 not_a_word (digits only; instant, no debounce/API) ──────────
- tapOn:
    id: 'search-clear'
- tapOn:
    id: 'search-input'
- inputText: '12345'
- assertVisible: "Hmm, that's not quite a card"

# ── DELETE UX: Word List swipe tray → confirm → toast + count drops ─────────
- tapOn:
    id: 'search-close'
- tapOn:
    id: 'tab-words'
- assertVisible: 'My Words'
- assertVisible: '60 words' # SMOKE_FIXTURES.DISTRIBUTION.summit total
- swipe:
    from:
      text: 'melancólico' # text on purpose — content anchor (see policy above)
    direction: LEFT
- tapOn:
    id: 'word-row-delete' # tray action (tray mounts only while swiped open)
- assertVisible: 'Delete “melancólico”\?'
- tapOn:
    id: 'confirm-accept' # ConfirmDialog confirm — no `below:` anchor needed
- assertVisible: 'Deleted “melancólico”'
- assertVisible: '59 words'

# ── Round trip home (same dead-screen guard as smoke.yaml) ───────────────────
- tapOn:
    id: 'tab-home'
- extendedWaitUntil:
    visible: '(?i)Word Mastery'
    timeout: 20000
