# CI-4b — search/capture flow smoke: the CRUD surfaces that exist today,
# against the mock DataSource (`smoke` EAS profile / dev builds).
# First-run caveat: the step most likely to need tuning on a real emulator is
# the row `swipe` — if this flow alone is red, start there.
#
# SELECTOR POLICY (2026-07-17): tap by testID, assert by TEXT.
#   - Taps/gestures only need to FIND an element → ids are locale-proof, immune
#     to copy changes, and collision-free (the 2026-07-16 system-Home-button bug;
#     the old tray-vs-confirm 'Delete' ambiguity that needed a `below:` anchor).
#     Ids: fab-search / search-input / search-clear / search-close (SearchScreen,
#     TabBar) · word-row-delete (WordRow tray) · confirm-accept (ConfirmDialog).
#   - Assertions VERIFY rendered content → they stay text on purpose. An id-only
#     assert passes on an empty or wrong render. Text drift is guarded at commit
#     time by src/test/maestroStrings.test.ts.
#   - Exception: the swipe anchors on text 'melancólico' — it doubles as a
#     content check (fixture word rendered), and row testIDs would need unicode/
#     index-based ids for no gain.
#
# What this verifies vs. what it CAN'T (mock-mode reality, 2026-07-13):
#   CREATE — lookup renders + Save flips to "Saved!". Mock saveCard() is a
#            no-op and getWords() serves fixtures, so the saved word does NOT
#            appear in Word List. True create→read persistence needs the live
#            (Supabase) path + a seeded account — CI-7, deferred.
#   READ   — deterministic mock fixtures: 'fly' → volar + mosca (Azure docs
#            example), phrase path fabricates '<phrase>·es'.
#   UPDATE — no update operation exists in DataSource; nothing to test yet.
#   DELETE — swipe tray → confirm dialog → toast + count decrement. Client-
#            optimistic only ("until the real delete mutation (03 write) lands").
# Gate paths (doc 16 §2): not_found (reserved miss token), identity-echo →
# unsaveable card, Tier-0 not_a_word (digits). wrong_script needs non-Latin
# input; Maestro inputText is ASCII-only on Android, so that case lives in the
# jest capture tests, not here.
#
# Fixture couplings (update together): mock.ts SMOKE_FIXTURES (WORD_BANK/
# DISTRIBUTION — summit = 60 words, melancólico present; MOCK_MISS='fly123456';
# MOCK_ECHO='echoword'; FLY_SENSES), en.json strings asserted below. All of
# these are enforced by src/test/maestroStrings.test.ts.
#
# Run locally: maestro test .maestro/word-capture.yaml
appId: com.lexicamp.app
tags:
  - candidate
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '(?i)Word Mastery'
    timeout: 20000

# ── Open search (FAB) ────────────────────────────────────────────────────────
- tapOn:
    id: 'fab-search'
- assertVisible: 'Type a word in .*' # placeholder = search sheet actually open

# ── READ: happy path — mock fixture 'fly' → volar (verb) + mosca (noun) ──────
- tapOn:
    id: 'search-input'
- inputText: 'fly'
- extendedWaitUntil:
    visible: 'volar'
    timeout: 10000
# Dismiss the autofocus keyboard before touching the lower card: the primary
# sense (volar) expands tall, pushing the SECOND sense row (mosca) and the Save
# button into the bottom third — behind the IME. volar (near the top) reads as
# visible with the keyboard up; mosca and result-save do not. Re-taps on
# search-input further down re-open the keyboard on their own.
- hideKeyboard
# mosca (2nd sense) + Save sit low: the expanded primary sense — now with the
# Show-example affordance — pushes them down, and hideKeyboard alone still left
# them off-screen on CI (2026-07-24). Scroll each into view before asserting /
# tapping. scrollUntilVisible is a no-op when the element is already visible.
- scrollUntilVisible:
    element:
      text: 'mosca'
    direction: DOWN
    centerElement: true
    timeout: 15000
- assertVisible: 'mosca'

# ── CREATE: save flips to optimistic saved state ─────────────────────────────
- scrollUntilVisible:
    element:
      id: 'result-save'
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: 'result-save'
- assertVisible: 'Saved!'

# ── READ: phrase path (unknown Latin phrase → fabricated '<phrase>·es') ──────
- tapOn:
    id: 'search-clear'
- tapOn:
    id: 'search-input'
- inputText: 'buenos dias'
- extendedWaitUntil:
    visible: 'buenos dias·es'
    timeout: 10000
- assertVisible: 'Save word'

# ── Gate: not_found (MOCK_MISS reserved token) ───────────────────────────────
- tapOn:
    id: 'search-clear'
- tapOn:
    id: 'search-input'
- inputText: 'fly123456'
- extendedWaitUntil:
    visible: "We couldn't find that one."
    timeout: 10000

# ── Gate: identity-echo → unsaveable card (Save replaced, notice shown) ──────
- tapOn:
    id: 'search-clear'
- tapOn:
    id: 'search-input'
- inputText: 'echoword'
- extendedWaitUntil:
    visible: "Can't save this"
    timeout: 10000

# ── Gate: Tier-0 not_a_word (digits only; instant, no debounce/API) ──────────
- tapOn:
    id: 'search-clear'
- tapOn:
    id: 'search-input'
- inputText: '12345'
- assertVisible: "Hmm, that's not quite a card"

# ── DELETE UX: Word List swipe tray → confirm → toast + count drops ─────────
- tapOn:
    id: 'search-close'
- tapOn:
    id: 'tab-words'
- assertVisible: 'My Words'
- assertVisible: '60 words' # SMOKE_FIXTURES.DISTRIBUTION.summit total
- swipe:
    from:
      text: 'melancólico' # text on purpose — content anchor (see policy above)
    direction: LEFT
- tapOn:
    id: 'word-row-delete' # tray action (tray mounts only while swiped open)
- assertVisible: 'Delete “melancólico”\?'
- tapOn:
    id: 'confirm-accept' # ConfirmDialog confirm — no `below:` anchor needed
- assertVisible: 'Deleted “melancólico”'
- assertVisible: '59 words'

# ── Round trip home (same dead-screen guard as smoke.yaml) ───────────────────
- tapOn:
    id: 'tab-home'
- extendedWaitUntil:
    visible: '(?i)Word Mastery'
    timeout: 20000
