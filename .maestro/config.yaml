# Folder-run manifest — CI runs `maestro test .maestro/` and executes ONLY the
# flows listed here.
#
# CORRECTION (2026-07-28, from the run-30261088531 maestro.log): `flows:` is an
# INCLUSION list, not an execution order. The planner logged
#   WorkspaceConfig(flows=[smoke.yaml, word-capture.yaml], executionOrder=null)
#   → ExecutionPlan(flowsToRun=[word-capture.yaml, smoke.yaml])
# and ran word-capture FIRST. The old comment here claimed list order was
# honoured; it never was. Ordering is a separate `executionOrder.flowsOrder:`
# key that takes flow names WITHOUT the extension (WorkspaceExecutionPlanner
# .parseFileName) and moves those flows into a sequence with its own
# continueOnFailure semantics.
#
# Not setting it today, deliberately: both flows start with
# `launchApp: clearState: true`, so they are independent and order only affects
# which flow a boot-level failure is reported under. Adding executionOrder would
# swap a cosmetic issue for an unrehearsed config path (a name typo makes the
# planner throw "Could not find flows needed for execution in order" and the
# whole nightly dies before the first tap). If we ever want deterministic order,
# rehearse it on a workflow_dispatch first.
#
# word-capture.yaml added 2026-07-13. If it alone is red, suspect the flow's
# gesture/visibility assumptions before the app — see notes in the flow header.
#
# 2026-08-06 — five flows added, taking the suite from "boot + capture" to the
# whole app. Each owns one subsystem so a red flow names its own cause:
#   quiz        the study loop (reveal → rate → the two post-session screens)
#   word-list   browse: search, sort, tier filter, the archived shelf, detail
#   decks       deck CRUD — the ONLY place the mock is a real data source
#               (create/delete/add/remove genuinely mutate) and the only place a
#               write REJECTION is exercised end to end
#   progress    all three sub-tabs + the projection card and mastery forecast
#   settings    every sheet opens; sign-out confirm reached and CANCELLED
#   walkthrough the whole nine-step tour (w1 → w8 → "Done, finish tour"), then
#               that it lands back on a LIVE Home — the guard for "a completed
#               tour stranded the user on the Progress tab". ⚠️ Works ONLY while
#               `enableAccessibility` is FALSE in TourGuideConfig
#               (src/tour/walkthrough.tsx); flip it and the flow dies at the
#               first `tapOn: 'Next…'`.
#
# All of them were run green on a local iOS simulator (iPhone 16 Pro Max, iOS
# 18.6) against a Release dev build in mock mode.
#
# 2026-08-21 — ✅ THE FULL EIGHT-FLOW SUITE IS GREEN ON ANDROID CI, first time:
# run 32463594990 at 5ff5f82, 8/8 in 13m 27s (word-list 2m 2s · word-capture
# 1m 58s · smoke 24s · decks 3m 6s · walkthrough 2m 33s · settings 1m 17s ·
# progress 34s · quiz 1m 33s). The cross-platform assumptions this header used
# to flag as unproven are now proven. Getting there took every scheduled run
# from 2026-07-18 to 2026-08-19 going red; the last one was 7/8 (settings, on
# "Email support — opens your mail app", fixed by 0499cbc).
#
# ⚠️ Read a failure against each flow's header notes before suspecting the app.
# Every fix this suite has needed has been GEOMETRY — a row under the FAB, a
# field behind the keyboard, a tap stolen by an overlay — not app logic. One
# green run is not a trend; watch the streak.
#
# Runtime: the suite is now ~6× its old length. If the nightly's budget becomes
# a problem, `executionOrder` is NOT the tool (see above) — drop flows from this
# list, or split the slow ones (quiz walks a whole 9-card session) onto a
# separate schedule.
flows:
  - smoke.yaml
  - word-capture.yaml
  - quiz.yaml
  - word-list.yaml
  - decks.yaml
  - progress.yaml
  - settings.yaml
  - walkthrough.yaml
