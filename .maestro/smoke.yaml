# CI-4 smoke flow — boots the app and traverses all four tabs, asserting each
# screen's headline text (en locale). Catches the highest-value regression
# classes: boot crashes, dead screens after navigation, and broken tab wiring.
# Uses the mock DataSource (summit/paid scenario, onboardingComplete=true →
# boots straight to Home). CI builds this with the `smoke` EAS profile
# (EXPO_PUBLIC_USE_SUPABASE=0); a live-mode build redirects to onboarding on
# first launch and this flow fails at its first assertion. If you change the
# flow's mode assumptions, change the profile in eas.json + nightly-smoke.yml.
#
# Run locally:  maestro test .maestro/smoke.yaml   (app installed on a booted
# emulator/simulator; https://maestro.mobile.dev for CLI install)
appId: com.lexicamp.app
---
- launchApp:
    clearState: true

# NOTE (assertions): eyebrow/section labels render via `textTransform:
# 'uppercase'`, so the accessibility text Maestro sees is UPPERCASE, and Maestro
# matches text as a case-SENSITIVE regex — assertions use the `(?i)` inline flag.
#
# NOTE (tab taps): tabs are tapped by testID (`tab-<id>`, set in ui/TabBar.tsx),
# NEVER by label text. The CI emulator uses 3-button navigation, and the system
# nav bar's Home button exposes the accessibility text "Home" — on 2026-07-16
# `tapOn: 'Home'` matched the SYSTEM button, backgrounded the app (launcher
# TO_FRONT in the WindowManager log), and failed the final assertion. IDs also
# hold if tab labels are ever localized.
# ── Home ─────────────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: '(?i)Word Mastery'
    timeout: 20000

# ── Word List ────────────────────────────────────────────────────────────────
- tapOn:
    id: 'tab-words'
- assertVisible: '(?i)My Words'

# ── Progress ─────────────────────────────────────────────────────────────────
- tapOn:
    id: 'tab-progress'
- assertVisible: '(?i)You are here'

# ── Settings ─────────────────────────────────────────────────────────────────
- tapOn:
    id: 'tab-settings'
- assertVisible: '(?i)Account'

# ── Back to Home (round trip — catches the dead-screen-after-nav class) ──────
- tapOn:
    id: 'tab-home'
# extendedWait, not assertVisible: the CI emulator needed 20s for Home's first
# render; give the return trip the same budget instead of the default assert wait.
- extendedWaitUntil:
    visible: '(?i)Word Mastery'
    timeout: 20000
